services:
  - type: web
    name: c2c-orlean
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: JT_API_URL
        value: https://jt-api.rockettechbr.com.br
      - key: JT_API_KEY
        sync: false
